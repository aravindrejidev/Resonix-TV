# ---- Gradle ----
# Sized for GitHub-hosted runners (private repos get ~7 GB RAM): Gradle daemon 2g + Kotlin daemon 2g.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m
org.gradle.parallel=true
org.gradle.caching=true

# ---- AndroidX / Kotlin ----
android.useAndroidX=true
kotlin.code.style=official

# ---- ResonixTV ----
# ABIs to compile. Most Android TV boxes are arm64-v8a; many cheap/older ones run a
# 32-bit userland (armeabi-v7a). Add x86_64 for the Android TV emulator.
# Override per build for faster CI runs, e.g.  -Presonix.abis=arm64-v8a
resonix.abis=arm64-v8a,armeabi-v7a
