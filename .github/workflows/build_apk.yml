# ResonixTV - build the release APKs and publish them as a GitHub Release.
#
# Run it:  Actions tab > "Release APK" > Run workflow > type the version (e.g. 1.0.4) > Run.
# Result:  GitHub Release "v1.0.4" with one signed APK per CPU type and a universal APK.
#          The in-app updater (Settings > Update) picks the right file for the TV by itself.
#
# Needs a PUBLIC repository (the app downloads updates without a login).
# Running the same version again replaces that release.
#
# Keep these in sync with the project:
#   Gradle 9.6.0       = minimum/default for AGP 9.4.0
#   NDK, CMake         = app/build.gradle.kts (ndkVersion, externalNativeBuild.cmake.version)
#   Build tools 36.0.0 = default for AGP 9.4.0

name: Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number to release, for example 1.0.4  (the release is tagged v1.0.4)"
        type: string
        required: true

concurrency:
  # Two releases never run at the same time, and a running release is never cancelled.
  group: release-apk
  cancel-in-progress: false

permissions:
  contents: write # create the release

env:
  GRADLE_VERSION: "9.6.0"
  NDK_VERSION: "28.2.13676358"
  CMAKE_VERSION: "3.22.1"
  BUILD_TOOLS_VERSION: "36.0.0"
  # One APK per entry (name of the file = ResonixTV-<version>-<abi>.apk), plus "universal" with all of them.
  ALL_ABIS: "arm64-v8a armeabi-v7a x86_64 x86"

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history + tags: needed for the "Changes" list of the release notes

      # The project may sit in a sub-folder if the ZIP was uploaded with its top folder.
      - name: Locate Gradle project
        run: |
          FOUND="$(find . -maxdepth 3 -name settings.gradle.kts -not -path './.git/*' -printf '%d %p\n' | sort -n | head -n 1 | cut -d' ' -f2-)"
          if [ -z "$FOUND" ]; then
            echo "::error title=Gradle project not found::settings.gradle.kts is missing. Upload the CONTENTS of the ResonixTV folder (not the folder itself) to the repository root."
            exit 1
          fi
          DIR="$(dirname "$FOUND")"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Gradle project directory: $DIR"
          MEDIA3_VERSION="$(sed -n 's/^media3 = "\([^"]*\)".*/\1/p' "$DIR/gradle/libs.versions.toml" | head -n 1)"
          echo "MEDIA3_VERSION=$MEDIA3_VERSION" >> "$GITHUB_ENV"
          echo "Media3 version (from libs.versions.toml): $MEDIA3_VERSION"

      # The version typed into "Run workflow" becomes the APK's versionName and the release tag.
      - name: Check the version number
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$(printf '%s' "$INPUT_VERSION" | tr -d '[:space:]')"
          VERSION="${VERSION#v}"
          VERSION="${VERSION#V}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){1,3}$'; then
            echo "::error title=Invalid version::Use numbers separated by dots, for example 1.0.4 (got '$INPUT_VERSION')."
            exit 1
          fi
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
          echo "Releasing version $VERSION (tag v$VERSION)"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # No Gradle wrapper in the repo: this action installs the exact Gradle version.
      - name: Set up Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          # 'basic' = MIT-licensed cache. The default 'enhanced' cache is a proprietary
          # component under Gradle's Terms of Use, so it is not used here.
          cache-provider: basic

      # The runner image has NDK 27/29 and CMake 3.31 only; install the pinned versions.
      - name: Install Android SDK components
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::warning::sdkmanager not found - Gradle will download missing SDK parts itself."
            exit 0
          fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "build-tools;${BUILD_TOOLS_VERSION}" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}" > /dev/null \
            || echo "::warning::sdkmanager could not install everything - Gradle will try the rest."

      # Fast guard (seconds): the C++ DSP engine must pass its own tests before anything else runs.
      - name: DSP self-test (host build)
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Iapp/src/main/cpp app/src/main/cpp/dsp/*.cpp tools/dsp_selftest_main.cpp -o "$RUNNER_TEMP/dsp_selftest"
          "$RUNNER_TEMP/dsp_selftest" | tee "$RUNNER_TEMP/dsp-selftest.txt"
          { echo '### DSP self-test'; echo '```'; cat "$RUNNER_TEMP/dsp-selftest.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # FFmpeg audio decoders (DTS, TrueHD, E-AC3 ...): built once, then restored from the cache.
      # A release is never published without them - if this step fails, the release stops here.
      - name: Restore FFmpeg decoder cache
        id: ffcache
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ env.PROJECT_DIR }}/third_party/media3-ffmpeg
            ${{ env.PROJECT_DIR }}/app/src/main/java/androidx/media3/decoder/ffmpeg
          key: ffmpeg-${{ runner.os }}-media3-${{ env.MEDIA3_VERSION }}-ndk${{ env.NDK_VERSION }}-${{ hashFiles('**/scripts/setup_ffmpeg.sh') }}

      - name: Build FFmpeg audio decoders (LGPL)
        if: steps.ffcache.outputs.cache-hit != 'true'
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          export NDK_PATH="$ANDROID_HOME/ndk/$NDK_VERSION"
          bash scripts/setup_ffmpeg.sh 2>&1 | tee "$RUNNER_TEMP/ffmpeg-build.log"

      - name: Save FFmpeg decoder cache
        if: steps.ffcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ env.PROJECT_DIR }}/third_party/media3-ffmpeg
            ${{ env.PROJECT_DIR }}/app/src/main/java/androidx/media3/decoder/ffmpeg
          key: ffmpeg-${{ runner.os }}-media3-${{ env.MEDIA3_VERSION }}-ndk${{ env.NDK_VERSION }}-${{ hashFiles('**/scripts/setup_ffmpeg.sh') }}

      - name: Check FFmpeg decoders are in place
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ROOT="third_party/media3-ffmpeg/jni/ffmpeg/android-libs"
          for abi in arm64-v8a armeabi-v7a; do
            if [ ! -f "$ROOT/$abi/libavcodec.a" ]; then
              echo "::error title=FFmpeg missing::FFmpeg decoders for $abi are missing, so the release was stopped."
              exit 1
            fi
          done
          for abi in $ALL_ABIS; do
            if [ -f "$ROOT/$abi/libavcodec.a" ]; then echo "FFmpeg decoders: $abi ok"; else echo "::warning::No FFmpeg decoders for $abi - that APK will use the TV's own decoders only."; fi
          done

      # One Gradle run with every CPU type (= the universal APK), then one run per CPU type.
      # The compiled Kotlin code and the native libraries are reused, so the extra runs are quick.
      - name: Build release APKs
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p dist
          APK_DIR="app/build/outputs/apk/release"

          build_apk() {   # $1 = name part in the file name, $2 = comma separated CPU types
            local label="$1" abis="$2"
            echo "::group::assembleRelease - $label ($abis)"
            rm -f "$APK_DIR"/*.apk
            gradle assembleRelease --stacktrace --console=plain \
              "-Presonix.abis=$abis" "-PappVersion=$APP_VERSION" 2>&1 | tee -a "$RUNNER_TEMP/gradle-build.log"
            echo "::endgroup::"
            local src
            src="$(ls "$APK_DIR"/*.apk 2>/dev/null | head -n 1 || true)"
            if [ -z "$src" ]; then
              echo "::error::Gradle finished but no release APK was produced for $label."
              exit 1
            fi
            cp "$src" "dist/ResonixTV-${APP_VERSION}-${label}.apk"
          }

          build_apk universal "$(echo "$ALL_ABIS" | tr ' ' ',')"
          for abi in $ALL_ABIS; do
            build_apk "$abi" "$abi"
          done
          ls -lh dist

      # Every APK must be signed, carry the right version and contain exactly its own CPU type.
      - name: Verify APKs
        id: verify
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          BT="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          if [ ! -x "$BT/apksigner" ]; then
            BT="$(dirname "$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)")"
          fi
          FF_ROOT="third_party/media3-ffmpeg/jni/ffmpeg/android-libs"
          fail=0

          check_apk() {   # $1 = file, $2 = CPU types it must contain (space separated)
            local f="$1" expected=" $2 " name badging libs abi
            name="$(basename "$f")"
            "$BT/apksigner" verify "$f" > /dev/null || { echo "::error::$name: signature check failed"; fail=1; }
            badging="$("$BT/aapt2" dump badging "$f")"
            grep -q "versionName='$APP_VERSION'" <<< "$badging" || { echo "::error::$name: wrong versionName"; fail=1; }
            grep -q "name='com.resonix.tv'" <<< "$badging" || { echo "::error::$name: wrong package name"; fail=1; }
            libs="$(unzip -Z1 "$f" | grep '^lib/' || true)"
            for abi in $ALL_ABIS; do
              if [[ "$expected" == *" $abi "* ]]; then
                grep -q "^lib/$abi/libresonix_native.so$" <<< "$libs" || { echo "::error::$name: libresonix_native.so missing for $abi"; fail=1; }
                if [ -f "$FF_ROOT/$abi/libavcodec.a" ]; then
                  grep -q "^lib/$abi/libffmpegJNI.so$" <<< "$libs" || { echo "::error::$name: FFmpeg decoders missing for $abi"; fail=1; }
                fi
              elif grep -q "^lib/$abi/" <<< "$libs"; then
                echo "::error::$name: contains $abi, which it should not"; fail=1
              fi
            done
            echo "checked $name"
          }

          check_apk "dist/ResonixTV-${APP_VERSION}-universal.apk" "$ALL_ABIS"
          for abi in $ALL_ABIS; do
            check_apk "dist/ResonixTV-${APP_VERSION}-${abi}.apk" "$abi"
          done
          [ "$fail" = "0" ] || exit 1

          (cd dist && sha256sum ./*.apk | sed 's#\./##' > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      # Publishes GitHub Release "v<version>". The in-app updater always looks for the newest release.
      - name: Publish GitHub Release
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          size_of() { du -h "dist/ResonixTV-${APP_VERSION}-$1.apk" | cut -f1; }

          PREV="$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -vx "$TAG" | head -n 1 || true)"
          if [ -n "$PREV" ] && git merge-base --is-ancestor "$PREV" HEAD 2> /dev/null; then
            RANGE="$PREV..HEAD"
          else
            RANGE="-n 15"
          fi
          CHANGES="$(git log $RANGE --no-merges --pretty='- %s' | head -n 40 || true)"

          {
            echo "## ResonixTV ${APP_VERSION}"
            echo ""
            echo "**Updating from inside the app?** Settings > Update picks the right file for your TV by itself."
            echo ""
            echo "**Installing by hand?** Download the file for your TV's processor. Not sure? Take \`universal\`."
            echo ""
            echo "| File | For | Size |"
            echo "|---|---|---|"
            echo "| \`ResonixTV-${APP_VERSION}-arm64-v8a.apk\` | Most Android TVs, boxes and streaming sticks (64-bit ARM) | $(size_of arm64-v8a) |"
            echo "| \`ResonixTV-${APP_VERSION}-armeabi-v7a.apk\` | Older or cheaper TVs with a 32-bit system (32-bit ARM) | $(size_of armeabi-v7a) |"
            echo "| \`ResonixTV-${APP_VERSION}-x86_64.apk\` | Intel / AMD devices, Android TV emulator | $(size_of x86_64) |"
            echo "| \`ResonixTV-${APP_VERSION}-x86.apk\` | Old 32-bit Intel devices | $(size_of x86) |"
            echo "| \`ResonixTV-${APP_VERSION}-universal.apk\` | Works on all of the above | $(size_of universal) |"
            echo ""
            echo "\`SHA256SUMS.txt\` lists the checksum of every file."
            echo ""
            echo "### Changes"
            echo "${CHANGES:-- (no changes listed)}"
            echo ""
            echo "_Build #${GITHUB_RUN_NUMBER} from commit ${GITHUB_SHA::7}_"
          } > "$RUNNER_TEMP/notes.md"

          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" dist/*.apk dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "ResonixTV ${APP_VERSION}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest

          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          {
            echo "### Released ResonixTV ${APP_VERSION}"
            echo ""
            echo "$RELEASE_URL"
            echo ""
            echo "| File | Size |"
            echo "|---|---|"
            for f in dist/*.apk; do echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"; done
          } >> "$GITHUB_STEP_SUMMARY"

      # Short, copy-friendly error digest on the run's summary page (handy on a phone).
      - name: Summarize errors
        if: failure()
        run: |
          {
            echo "### Release failed - key errors"
            echo "Copy the block below when asking for help."
            echo '```'
            if [ -f "$RUNNER_TEMP/gradle-build.log" ]; then
              grep -E '^e: |CMake Error|error: |Could not (resolve|find)|R8: |Missing class' "$RUNNER_TEMP/gradle-build.log" | head -n 25 || true
              echo '---'
              sed -n '/^FAILURE: /,/^\* Try:/p' "$RUNNER_TEMP/gradle-build.log" | head -n 40 || true
            fi
            if [ -f "$RUNNER_TEMP/ffmpeg-build.log" ]; then
              echo '--- FFmpeg build ---'
              grep -iE 'error|fatal|not found|No such file' "$RUNNER_TEMP/ffmpeg-build.log" | head -n 15 || true
              tail -n 25 "$RUNNER_TEMP/ffmpeg-build.log" || true
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
