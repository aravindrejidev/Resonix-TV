# Version catalog - checked against official release pages on 12 Oct 2026.

[versions]
agp = "9.4.0"                 # needs Gradle 9.6.0 + JDK 17
kotlin = "2.4.0"              # KGP + Compose compiler plugin (also pinned in root build.gradle.kts)
composeBom = "2026.09.00"
activityCompose = "1.13.0"
coreKtx = "1.19.1"
media3 = "1.11.1"
coroutines = "1.11.0"
oboe = "1.10.0"
checkerQual = "3.42.0"

[libraries]
# Jetpack Compose (versions managed by the BOM)
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-animation = { group = "androidx.compose.animation", name = "animation" }

# AndroidX
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# Media3 / ExoPlayer
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }
androidx-media3-exoplayer-dash = { group = "androidx.media3", name = "media3-exoplayer-dash", version.ref = "media3" }
androidx-media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }

# Compile-time only: annotations used by the Media3 FFmpeg extension sources (fetched in CI)
checker-qual = { group = "org.checkerframework", name = "checker-qual", version.ref = "checkerQual" }

# Native audio engine (C++ / Prefab)
oboe = { group = "com.google.oboe", name = "oboe", version.ref = "oboe" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
